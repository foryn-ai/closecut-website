<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" fill="none">
  <defs>
    <linearGradient id="floorBase" x1="600" y1="0" x2="600" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EFE8DC" />
      <stop offset="1" stop-color="#E1D6C5" />
    </linearGradient>
    <linearGradient id="floorGlow" x1="600" y1="0" x2="600" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="woodGrain" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.6" numOctaves="2" seed="11" />
      <feColorMatrix
        type="matrix"
        values="0 0 0 0 0.44
                0 0 0 0 0.40
                0 0 0 0 0.34
                0 0 0 0.08 0"
      />
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#floorBase)" />
  <rect width="1200" height="280" fill="url(#floorGlow)" />
  <rect width="1200" height="280" filter="url(#woodGrain)" />

  <path d="M0 110H1200" stroke="#D3C5AF" stroke-opacity="0.2" stroke-width="1.4" />
  <path d="M0 190H1200" stroke="#D3C5AF" stroke-opacity="0.14" stroke-width="1.2" />

  <path d="M600 0L300 280" stroke="#CBBCA4" stroke-opacity="0.22" stroke-width="1.4" />
  <path d="M600 0L420 280" stroke="#CBBCA4" stroke-opacity="0.2" stroke-width="1.3" />
  <path d="M600 0L510 280" stroke="#CBBCA4" stroke-opacity="0.18" stroke-width="1.2" />
  <path d="M600 0L690 280" stroke="#CBBCA4" stroke-opacity="0.18" stroke-width="1.2" />
  <path d="M600 0L780 280" stroke="#CBBCA4" stroke-opacity="0.2" stroke-width="1.3" />
  <path d="M600 0L900 280" stroke="#CBBCA4" stroke-opacity="0.22" stroke-width="1.4" />

  <path d="M600 0L180 280" stroke="#CBBCA4" stroke-opacity="0.14" stroke-width="1.1" />
  <path d="M600 0L1020 280" stroke="#CBBCA4" stroke-opacity="0.14" stroke-width="1.1" />
</svg>
